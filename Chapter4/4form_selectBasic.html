<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>4form_selectBasic</title>
</head>
<body>
    
    <h2>4선택가능한 입력 양식</h2>
    <select>
        <option>김밥</option>
        <option>라면</option>
        <option>떡볶이</option>
        <option>순대</option>
    </select>

    <h2>5여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>라면</option>
        <option>떡볶이</option>
        <option>순대</option>
    </select>

    <h2>6선택 옵션 묶기</h2>
    <!-- optgroup 태그를 사용해 선택 옵션을 그룹화 -->
    <select>
        <optgroup label="HTML">
            <option>Multimedia tags</option>
            <option>Connectivity</option>
            <option>Device Access</option>
        </optgroup>

        <optgroup label="CSS">
            <option>CSS Selectors</option>
            <option>Box Model</option>
        </optgroup>
    </select>
</body>
</html>
